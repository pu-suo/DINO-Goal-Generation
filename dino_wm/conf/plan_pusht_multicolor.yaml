defaults:
  - _self_

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_multicolor_${model_name}_${multicolor.combo_split}${multicolor.mask_tag}

# --- model: shipped PushT dynamics (frozen) reused in the multi-color env ------
ckpt_base_path: ./checkpoints      # ${ckpt_base_path}/outputs/<model_name>
model_name: pusht
model_epoch: latest

seed: 99
n_evals: 50
goal_H: 5
n_plot_samples: 10
goal_source: named_target          # oracle goal = real frame w/ block at NAMED target
debug_dset_init: False
# Phase-0 isolation: when goal_source=dset, perturb the (real) goal-frame pusher
# on the MULTICOLOR model (real|behind|offmap|random). No effect on named_target.
goal_pusher_perturbation: real
goal_pusher_offset: 40.0
# Planning speed (docs/PLANNING_SPEED_PROFILE.md): fast_encode is default-on via the
# planner config (override +planner.sub_planner.fast_encode=false for A/B).
# plan_eval_mode: force eval() at plan time -- EXPECTED NO-OP (ckpts pickle post-val()
# in eval mode; verify with scripts/check_ckpt_train_mode.py). Fast-config hygiene.
plan_eval_mode: false
# Fast config bundle (all default OFF = stock; numerics-only when enabled; one bundled
# re-anchor covers the set -- see docs/PLANNING_SPEED_PROFILE.md "Fast config bundle"):
#   plan_eval_mode=true fast_tf32=true fast_sdpa=true \
#   planner.sub_planner.eval_every=999 planner.sub_planner.skip_succeeded=true \
#   planner.sub_planner.traj_chunk=4
fast_tf32: false
fast_sdpa: false

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1                          # set 0 for masked runs (proprio == manipulator)
  base: 2
  mode: last

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 10   # WAS null -> np.inf (mpc.py:41): never terminates at SR<1.0 (re-rolls a growing
                 # action seq each round). The validated runs used 10.
  n_taken_actions: 5
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 5
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 30
    eval_every: 1
    skip_succeeded: false  # fast config: skip CEM for trajs MPC already marked successful
    traj_chunk: 1          # fast config: trajs batched per rollout call (>1 needs fast_sdpa)
  name: mpc_cem

# --- multi-color oracle settings ---------------------------------------------
multicolor:
  data_path: ${oc.env:DATASET_DIR}/pusht_multicolor   # for the frozen split + (optional) in-dist inits
  n_targets: 4
  outline_thickness: 7
  success_threshold: 0.95
  n_bins: 3
  heldout_frac: 0.2
  split_seed: 0
  combo_split: heldout              # heldout (HEADLINE) | train | all
  max_goal_dist: null               # px; if set, named target within reach of block
                                    # (short push) for fast/easy oracle testing.
                                    # BREAKS decorrelation -- not for the headline eval.
  max_goal_angle: null              # rad; if set, named target orientation within this
                                    # of the block START angle (~no rotation needed).
                                    # Pair w/ small max_goal_dist => trivially-reachable
                                    # sanity goal. Diagnostic crutch, not for headline.
  goal_pusher: hide                 # hide | behind | contact. WHERE the pusher sits in the oracle goal.
                                    #  hide   -> off-screen; pair with objective.alpha=0. No
                                    #            pusher-approach signal -> sparse reward, ~0.3.
                                    #  behind -> block@target - 40px*unit(travel); IGNORES block
                                    #            theta so it overlaps the T for ~62% of rotated
                                    #            goals (impossible goal latent). Kept for A/B only.
                                    #  contact-> like behind but on the rotated-T contact surface
                                    #            (never overlaps the T); the reachable/plausible
                                    #            pusher. Pair with objective.alpha=1.
  goal_pusher_offset: 40.0          # px behind the block for goal_pusher=behind
  use_manipulator_mask: false       # CEM energy drops the pusher patches (legacy; moot when
                                    # hide_goal_pusher=true since the goal has no pusher)
  mask_tag: ""                      # set to e.g. _masked for the run dir name
  layout_seed_base: 5000000
  stats_source: model               # 'model' = pusht_noise norm (shipped dynamics)
