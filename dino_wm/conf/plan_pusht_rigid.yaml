defaults:
  - _self_

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_rigid_${model_name}_${goal_source}

# model: the RETRAINED clean dynamics (outputs/clean_retrain). Override ckpt_base_path to
# the dir holding outputs/<model_name>/ (the retrain run dir on the 4090).
ckpt_base_path: ./checkpoints
model_name: clean_retrain
model_epoch: latest

seed: 99
n_evals: 36                       # stratified ~4 per 9 regions
goal_H: 5
n_plot_samples: 10
goal_source: oracle               # oracle | random (bridge/swapped_spec in Phase 4)
debug_dset_init: False
goal_pusher_perturbation: real
goal_pusher_offset: 40.0
plan_eval_mode: false
fast_tf32: false
fast_sdpa: false
# Deployable masked energy: objective.alpha=0 + mask_pusher=true (drop the goal-frame
# pusher patches; the rigid goal frame already has the pusher at its transformed contact).
mask_pusher: false
mask_dilation: 1
pose_only_success: false          # success comes from the env's success_mode=regional, not pose_only

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1                         # set 0 for the deployable masked run
  base: 2
  mode: last

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 10
  n_taken_actions: 5
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 5
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 30
    eval_every: 1
    skip_succeeded: false
    traj_chunk: 1
  name: mpc_cem

# --- rigid (clean-scene language goals) ---------------------------------------
rigid:
  data_path: ${oc.env:DATASET_DIR}/pusht_rigid   # disjoint test split (held-out trajectory pool)
  split: test
  stratify_regions: true                          # round-robin the 9 regions across n_evals
