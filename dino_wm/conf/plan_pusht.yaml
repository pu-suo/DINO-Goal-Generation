defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
  sweep:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 256
    gres: "gpu:h100:1"
    qos: "explore"
    timeout_min: 720
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

# model to load for planning
ckpt_base_path: ./checkpoints  # put absolute path here. Checkpoints will be loaded from ${ckpt_base_path}/outputs
model_name: null
model_epoch: latest

seed: 99
n_evals: 50
goal_source: 'dset'
goal_H: 5 
n_plot_samples: 10

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: last

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: null 
  n_taken_actions: 5
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 5
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 30
    eval_every: 1
  name: mpc_cem

# --- Phase-0 isolation tests (defaults below are exact no-ops -> stock ~0.90) ---
env_with_distractors: false      # TEST 1: render colored T-outline distractors (stock env)
env_n_distractors: 0             # number of distractor decals (sweep 1..3)
distractor_outline_thickness: 7  # 512-space px (~3px at render_size=224)
goal_pusher_perturbation: real   # TEST 2: real | behind | contact | offmap | random (goal-frame pusher)
                                 #         (== "goal_pusher_source" in the masked-energy matrix)
goal_pusher_offset: 40.0         # px behind block@goal for 'behind' ('contact' ignores; uses T support dist)
pose_only_success: false         # TEST 2: block-only success (ignore the manipulator)

# --- Manipulator-masked planning energy (STEP 2; see docs/MASKED_ENERGY_NOTE.md) ---
# Drop the pusher's patches from the visual L2 (g-style object-only energy). Pair with
# objective.alpha=0 to also drop the proprio (pusher) term. Masks the UNION of the
# goal-frame pusher and the real recorded pusher; success criterion is untouched.
mask_pusher: false               # true -> set CEMPlanner.patch_mask (pusher patches dropped)
mask_dilation: 0                 # extra rings of neighbour patches to drop (0 = pusher only)

# --- Planning speed (see docs/PLANNING_SPEED_PROFILE.md) ----------------------
# fast_encode (default true, RESULT-PRESERVING): cache the start-obs DINOv2 encode
# instead of re-encoding it per CEM candidate. Override for the A/B regression with
#   +planner.sub_planner.fast_encode=false
# plan_eval_mode (default false, RESULT-CHANGING -> needs re-validation): run the
# dynamics model in eval() at plan time, disabling the predictor's train-mode dropout.
plan_eval_mode: false

