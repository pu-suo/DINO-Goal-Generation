_target_: planning.mpc.MPCPlanner
max_iter: 10 # WAS null -> np.inf (mpc.py:41): never terminates at SR<1.0; plan.py now fails fast on inf.
n_taken_actions: 1
sub_planner:
  target: planning.gd.GDPlanner
  horizon: 5
  action_noise: 0.003
  sample_type: 'randn' # 'zero' or 'randn'
  lr: 1 
  opt_steps: 1000
  eval_every: 10

name: mpc_gd