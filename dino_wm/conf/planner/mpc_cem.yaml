_target_: planning.mpc.MPCPlanner
max_iter: 10 # MPC rounds. null -> np.inf (mpc.py:41) NEVER terminates at SR<1.0 (footgun); use 10.
n_taken_actions: 5
sub_planner:
  target: planning.cem.CEMPlanner
  horizon: 5
  topk: 30
  num_samples: 300
  var_scale: 1
  opt_steps: 30
  eval_every: 1
  # Fast-config knobs (docs/PLANNING_SPEED_PROFILE.md "Fast config bundle"); defaults =
  # stock behavior. Result-CHANGING when enabled (the bundled re-anchor covers them).
  skip_succeeded: false  # skip full CEM for trajs MPC already marked successful
  traj_chunk: 1          # trajs batched per rollout call (pair >1 with fast_sdpa=true)

name: mpc_cem